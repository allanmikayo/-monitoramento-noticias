# ---------------------------------------------------------------------------
# PLANO B: VM.Standard.E2.1.Micro -- 1 GB de RAM, 1/8 de OCPU (com burst)
#
# POR QUE EXISTE (10/09/2026). O Ampere A1 do Always Free tem histórico de
# "Out of host capacity" em sa-saopaulo-1 por DIAS seguidos -- há relato de
# mais de mil tentativas automáticas sem sucesso. E a região não dá para
# trocar: o Always Free vive na região "home" da conta, escolhida no cadastro
# e definitiva. Como o `vercel.json` fixa `gru1`, São Paulo é obrigatória.
#
# O E2.1.Micro (AMD) não tem esse problema -- está sempre disponível, e dá
# para ter DOIS deles. É pouca máquina, mas o banco do Allan tem ~111 MB:
# cabe inteiro em cache mesmo com 1 GB.
#
# Use esta configuração APENAS nessa máquina. No A1 use `postgresql.conf`,
# que é dimensionado para 12 GB.
#
#     docker compose --env-file .env -f docker-compose.yml up -d   # normal
#     PG_CONF=postgresql-micro.conf docker compose up -d           # micro
#
# E no E2.1.Micro ligue swap antes (o `00-preparar-vm.sh --micro` faz):
# 1 GB sem swap mata o contêiner no primeiro pico de VACUUM.
# ---------------------------------------------------------------------------

listen_addresses = '*'
port = 5432

max_connections = 40             # quem enfileira cliente é o PgBouncer
shared_buffers = 256MB           # 25% de 1 GB
effective_cache_size = 640MB
work_mem = 4MB                   # 40 conexões x ordenação: tem que ser modesto
maintenance_work_mem = 64MB
random_page_cost = 1.1
effective_io_concurrency = 200

wal_compression = on
checkpoint_completion_target = 0.9
max_wal_size = 512MB
min_wal_size = 128MB

autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 60s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 0
log_truncate_on_rotation = on
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'America/Sao_Paulo'
timezone = 'America/Sao_Paulo'

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 2000
pg_stat_statements.track = top

statement_timeout = 300000
idle_in_transaction_session_timeout = 60000
