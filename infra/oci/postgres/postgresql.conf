# Postgres 17 -- VM Always Free da OCI (2 OCPU ARM / 12 GB RAM).
#
# O ponto de partida deste arquivo é um fato do seu caso: o banco inteiro
# tem ~111 MB e cresce ~76 MB/ano. Com 12 GB de RAM, ele cabe em cache
# centenas de vezes. Depois do primeiro acesso, praticamente nenhuma
# consulta volta a tocar o disco -- que era exatamente o gargalo que
# derrubou o Supabase (Disk IO em 100% com CPU em 18%).

# ---------------------------------------------------------------- rede
listen_addresses = '*'          # '*' DENTRO do contêiner; o docker-compose
                                 # publica só em 127.0.0.1, ver o comentário lá.
port = 5432
max_connections = 100            # quem enfileira cliente é o PgBouncer, não isto

# ---------------------------------------------------------------- memória
shared_buffers = 3GB             # o banco cabe aqui inteiro, com folga
effective_cache_size = 9GB       # dica ao planejador: o SO tem muito cache
work_mem = 32MB                  # ordenações e hash joins das telas analíticas
maintenance_work_mem = 512MB     # VACUUM, CREATE INDEX e restauração rápidos

# ---------------------------------------------------------------- disco
# Block volume da OCI é NVMe. O padrão 4.0 assume disco giratório e faz o
# planejador evitar índice sem motivo -- foi parte do que fazia varredura
# parecer barata na instância antiga.
random_page_cost = 1.1
effective_io_concurrency = 200

# ---------------------------------------------------------------- WAL
wal_compression = on
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB

# ---------------------------------------------------------------- autovacuum
# A tabela `negocios_b3` recebe ~17 mil inserções por pregão e é podada
# todo dia -- é o padrão que mais gera linha morta no projeto. Os padrões
# do Postgres (20% da tabela) demoram demais para reagir num caso assim.
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# ---------------------------------------------------------------- logs
# Substitui o painel de logs do Supabase. `log_min_duration_statement`
# registra só o que demora -- é o que você vai querer ler quando alguma
# tela ficar lenta, sem gravar as milhares de consultas normais.
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 0
log_truncate_on_rotation = on
log_min_duration_statement = 1000    # ms
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'America/Sao_Paulo'
timezone = 'America/Sao_Paulo'

# ---------------------------------------------------------------- métricas
# Mantém `scripts/diagnostico_banco.py` funcionando igual: é daqui que ele
# tira o ranking de consultas mais caras.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top

# ---------------------------------------------------------------- limites
# Nenhuma consulta do dashboard leva mais que segundos. Cinco minutos é
# teto de segurança contra consulta travada, não meta de desempenho.
statement_timeout = 300000              # 5 min
idle_in_transaction_session_timeout = 60000
