;; PgBouncer -- o ÚNICO serviço exposto à internet nesta VM.
;;
;; POR QUE ELE É OBRIGATÓRIO AQUI. O site roda na Vercel como função
;; serverless e o projeto usa `NullPool` de propósito (ver app/db.py): cada
;; requisição abre e fecha a própria conexão. Sem um pooler na frente, um
;; punhado de acessos simultâneos esgota o `max_connections` do Postgres.
;; Era exatamente esse o papel do Supavisor no Supabase -- e é por isso que
;; o plano gratuito da Aiven não serviria: lá o pooling é só no pago.
;;
;; MODO TRANSAÇÃO, e o código já está pronto para ele: `app/db.py` define
;; `prepare_threshold=None` no psycopg desde julho, justamente porque
;; prepared statement no lado do servidor quebra com pooler de transação.
;; Nada muda na aplicação além da string de conexão.

[databases]
;; O cliente pede `credit_monitor` e cai no Postgres local do contêiner.
credit_monitor = host=127.0.0.1 port=5432 dbname=credit_monitor

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; ---------------------------------------------------------------- TLS
;; O tráfego Vercel -> VM e GitHub Actions -> VM atravessa a internet
;; aberta. `require` recusa conexão sem TLS; não é opcional aqui.
client_tls_sslmode = require
client_tls_cert_file = /etc/pgbouncer/tls/fullchain.pem
client_tls_key_file  = /etc/pgbouncer/tls/privkey.pem

;; Do PgBouncer ao Postgres o tráfego não sai de 127.0.0.1, então TLS ali
;; só custaria CPU sem proteger de nada.
server_tls_sslmode = disable

;; ---------------------------------------------------------------- auth
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; PARAMETROS DE INICIALIZACAO (10/09/2026)
;;
;; Em modo transacao o PgBouncer recusa, por padrao, qualquer parametro que o
;; cliente mande no `options` da conexao:
;;     FATAL: unsupported startup parameter in options: statement_timeout
;; Ele nao pode simplesmente repassar: uma conexao de servidor e reaproveitada
;; entre clientes diferentes, e um `SET` de um vazaria para o proximo.
;;
;; `app/db.py::criar_engine_manutencao` manda statement_timeout, lock_timeout e
;; idle_in_transaction_session_timeout no `options` -- foi a correcao para a
;; Supabase, que punha um limite curto no ROLE. Aqui esse problema nao existe:
;; os mesmos limites ja estao no postgresql.conf, valendo para todo mundo.
;;
;; Listar aqui faz o PgBouncer ACEITAR e IGNORAR, que e o comportamento certo:
;; o cliente conecta, e os limites vem do servidor.
ignore_startup_parameters = extra_float_digits,search_path,statement_timeout,lock_timeout,idle_in_transaction_session_timeout

;; NOTA DE SINTAXE (10/09/2026). O parser do PgBouncer NAO tira comentario no
;; fim de uma linha de valor -- ele engole o resto como parte do valor e recusa
;; a configuracao inteira:
;;     invalid value "500        ;; quantos clientes..." for parameter
;;     max_client_conn in configuration (/etc/pgbouncer/pgbouncer.ini:40)
;; Comentario aqui e SEMPRE em linha propria. Testado subindo o pgbouncer 1.22
;; com este arquivo antes de commitar.

;; ---------------------------------------------------------------- pool
pool_mode = transaction
;; quantos clientes podem estar conectados aqui
max_client_conn = 500
;; quantas conexões reais ao Postgres, por par usuário/banco
default_pool_size = 25
;; evita pagar o custo de abrir conexão a frio
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 600

;; ---------------------------------------------------------------- limites
;; Um job do Actions pode segurar uma transação longa; 10 min é folga sobre
;; o `statement_timeout` de 5 min do Postgres, não um segundo teto.
query_wait_timeout = 120
server_lifetime = 3600
client_idle_timeout = 0

;; ---------------------------------------------------------------- logs
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
admin_users = credit_admin
stats_users = credit_admin
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
