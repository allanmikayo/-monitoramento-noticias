{% extends "base.html" %}
{% block title %}Notícias{% endblock %}
{% block content %}
<script type="application/json" id="companies-data">{{ companies_json | safe }}</script>

<div class="filters-bar">
  <div class="window-tabs" id="window-tabs">
    <button data-window="24h" class="win-btn">Últimas 24h</button>
    <button data-window="5d" class="win-btn">Últimos 5 dias</button>
    <button data-window="30d" class="win-btn active">Último mês</button>
  </div>

  <!-- Setor/Empresa/Cobertura viraram multi-select (pedido do Allan,
       03/08/2026: poder marcar mais de uma opção) -- select nativo não
       suporta bem multi-seleção com busca, então cada um vira um botão +
       painel de checkboxes (static/app.js, função `initMultiSelect`).
       filter-type continua single-select de propósito (não foi pedido). -->
  <div class="ms" id="ms-sector">
    <button type="button" class="ms-btn" id="ms-sector-btn">Setor: Todos</button>
    <div class="ms-panel" id="ms-sector-panel" hidden>
      <button type="button" class="ms-clear" data-clear-target="ms-sector">Limpar seleção</button>
      {% for s in sectors %}
      <label class="ms-option"><input type="checkbox" class="ms-check" data-ms="sector" value="{{ s.id }}"> {{ s.name }}</label>
      {% endfor %}
    </div>
  </div>

  <div class="ms" id="ms-company">
    <button type="button" class="ms-btn" id="ms-company-btn">Empresa: Todas</button>
    <div class="ms-panel" id="ms-company-panel" hidden>
      <input type="search" id="ms-company-search" placeholder="Buscar empresa…">
      <button type="button" class="ms-clear" data-clear-target="ms-company">Limpar seleção</button>
      <div id="ms-company-options"></div>
    </div>
  </div>

  <select id="filter-type">
    <option value="">Todos os tipos</option>
    <option value="news">Notícia</option>
    <option value="rating_action">Ação de rating</option>
    <option value="fato_relevante">Documento CVM</option>
    <option value="assembleia">Assembleia (AGD/AGT)</option>
    <option value="research">Research</option>
  </select>

  <div class="ms" id="ms-coverage" title="Minha cobertura: empresas/setores que você acompanha + todas as ações de rating. Todos: tudo que foi capturado, mesmo sem bater com sua cobertura.">
    <button type="button" class="ms-btn" id="ms-coverage-btn">Cobertura: Minha cobertura</button>
    <div class="ms-panel" id="ms-coverage-panel" hidden>
      <label class="ms-option"><input type="checkbox" class="ms-check" data-ms="coverage" value="minha" checked> Minha cobertura</label>
      <label class="ms-option"><input type="checkbox" class="ms-check" data-ms="coverage" value="todos"> Todos</label>
    </div>
  </div>

  {% if user %}<button id="btn-refresh" class="btn-primary">Forçar atualização</button>{% endif %}
</div>

<div id="progress-wrap" class="progress-wrap" style="display:none;">
  <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
  <span id="progress-label" class="muted small"></span>
</div>

<div class="status-bar">
  <span id="status-text">Carregando…</span>
  <span id="countdown" class="muted"></span>
</div>

<details id="diagnostic-panel" class="diagnostic-panel">
  <summary>Diagnóstico da última varredura <span id="diagnostic-summary" class="muted"></span></summary>
  <table class="table" id="diagnostic-table">
    <thead><tr><th>Fonte</th><th>Encontrados</th><th>Relevantes p/ sua cobertura</th><th>Novos no banco</th><th>Situação</th></tr></thead>
    <tbody id="diagnostic-tbody"></tbody>
  </table>
</details>

<div id="article-list" class="article-list"></div>

<script>window.SCAN_INTERVAL_MINUTES = {{ scan_interval_minutes }};</script>
<script src="/static/app.js"></script>
{% endblock %}
