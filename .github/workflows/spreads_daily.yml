name: Spreads de debêntures (diário)

# Roda scripts/fetch_debenture_spreads.py sem --start -- ele mesmo detecta
# o último dia útil já publicado na Anbima e captura só esse dia (ver
# app/spreads/fetch.py detect_latest_published_date). Pedido do Allan
# (24/07/2026): atualizar todo dia às 21h (horário de Brasília).
#
# 21h BRT = 00h UTC (Brasil não tem horário de verão desde 2019, fuso fixo
# -3 -- não precisa de ajuste sazonal no cron). Diferente do negócio a
# negócio da B3 (b3_trades.yml), aqui NÃO tem relay via cron-job.org --
# uma atualização por dia não precisa da mesma precisão que uma a cada 15
# min, e o `schedule:` nativo do GitHub (mesmo com o atraso documentado em
# horário de pico) é preciso o suficiente pra rodar "em algum momento
# perto de 21h" uma vez por dia.
on:
  # AGENDAMENTO RESTAURADO em 20/08/2026, a pedido do Allan: *"separe em
  # actions individuais, assim se um der erro não quebra o fluxo inteiro"*.
  #
  # Ficou desligado por algumas horas nesse mesmo dia, quando a
  # `rodada_noturna.yml` foi ligada e passou a rodar este script também.
  # A troca resolvia o problema real (o fechamento diário da B3, que não
  # tinha workflow nenhum), mas junto desligava dois jobs que funcionavam
  # -- mudança maior que o necessário. Agora cada peça tem seu próprio
  # workflow e uma falha isolada não leva as outras junto.
  schedule:
    - cron: "0 0 * * *"
  # `start`/`end` opcionais -- vazio (uso normal do dia a dia) = só o
  # último dia útil publicado, igual ao cron. Preenchidos = backfill
  # pontual disparado manualmente pelo Allan em Actions -> "Run workflow"
  # (pedido dele, 24/07/2026: catch-up dos últimos 5 dias na primeira vez
  # que o módulo sobe pro Supabase, já que o histórico de 2 anos só existe
  # no banco local -- ver CLAUDE.md).
  workflow_dispatch:
    inputs:
      start:
        description: "Data inicial (AAAA-MM-DD) -- deixe em branco pro uso normal (só hoje)"
        required: false
        default: ""
      end:
        description: "Data final (AAAA-MM-DD) -- deixe em branco (usa a mesma que start, ou hoje)"
        required: false
        default: ""

concurrency:
  group: spreads_daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # FAULTHANDLER (08/09/2026). Duas execuções morreram com
    # `Segmentation fault (core dumped)` -- exit 139, o processo abatido
    # pelo sistema, sem exceção e sem traceback: a varredura de notícias e
    # o catch-up do negócio a negócio da B3. Sem stack não há diagnóstico,
    # só palpite.
    #
    # Esta variável liga o `faulthandler` da biblioteca padrão do Python:
    # ao receber SIGSEGV, ele imprime a pilha de chamadas (inclusive a
    # linha de código C que estourou) antes de morrer. Custo zero em
    # execução normal.
    env:
      PYTHONFAULTHANDLER: "1"
      # Implementacao do psycopg: `python` usa a libpq do sistema em vez do
      # wheel binario -- ver o passo "Instalar dependencias". Explicito de
      # proposito: se um dia a libpq sumir do runner, o job falha na hora,
      # com mensagem clara, em vez de voltar em silencio pro binario que
      # causava o segfault.
      PSYCOPG_IMPL: python
    timeout-minutes: 15
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        # SEM O WHEEL BINARIO DO PSYCOPG (08/09/2026).
        #
        # CAUSA RAIZ, achada com o faulthandler ligado neste mesmo dia. O
        # processo morria com `Segmentation fault` (exit 139) e a pilha
        # apontou para dentro do psycopg_binary, executando `SELECT
        # version()` -- a consulta que o SQLAlchemy faz UMA vez, ao abrir a
        # primeira conexao. Ou seja: nao era volume de dado, nao era o
        # INSERT, nao era o Playwright. Era a conexao em si.
        #
        # `psycopg[binary]` traz a propria libpq E o proprio OpenSSL dentro
        # do wheel. No mesmo processo ja existe outro OpenSSL, o do Python
        # (usado por requests/urllib3 e, na varredura, pelo curl_cffi). Dois
        # OpenSSL carregados juntos e uma fonte classica de segfault durante
        # o handshake TLS -- e a conexao com o Supabase e TLS.
        #
        # Tirando o wheel binario, o psycopg passa a usar a libpq do sistema
        # (que o runner ja tem) e o OpenSSL do sistema. Um so, sem conflito.
        #
        # requirements.txt continua pedindo `psycopg[binary]` de proposito:
        # no Windows do Allan nao ha libpq do sistema, e la o wheel binario e
        # a unica opcao que funciona. A troca vale so aqui, no runner Linux.
        run: |
          pip install -r requirements.txt
          pip uninstall -y psycopg-binary || true
          python -c "import psycopg" \
            || (sudo apt-get update -qq && sudo apt-get install -y -qq libpq5)
          python -c "import psycopg; print('psycopg impl:', psycopg.pq.__impl__, '| libpq', psycopg.pq.version())"

      - name: Capturar spreads
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANBIMA_CLIENT_ID: ${{ secrets.ANBIMA_CLIENT_ID }}
          ANBIMA_CLIENT_SECRET: ${{ secrets.ANBIMA_CLIENT_SECRET }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.start }}" ]; then ARGS="$ARGS --start ${{ github.event.inputs.start }}"; fi
          if [ -n "${{ github.event.inputs.end }}" ]; then ARGS="$ARGS --end ${{ github.event.inputs.end }}"; fi
          python -m scripts.fetch_debenture_spreads $ARGS
