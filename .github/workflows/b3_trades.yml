name: Negócio a negócio B3 (debêntures/CRI/CRA)

# Roda scripts/fetch_b3_trades.py sem argumentos (só o dia de hoje). Pedido
# do Allan (24/07/2026): atualizar a cada 15 min ENQUANTO O MERCADO ESTÁ
# ABERTO (10h-16h de pregão de renda fixa na B3, com folga até 18h pra
# pegar negócios de Registro que aparecem um pouco depois do fechamento --
# ver app/spreads/b3_trades.py).
#
# Igual à varredura de notícias (scrape.yml): o `schedule:` nativo do
# GitHub Actions NÃO é pontual o suficiente pra uma cadência de 15 min (é
# limitação documentada do próprio GitHub, já vimos isso na prática com a
# varredura de notícias, 17/07/2026). Quem dispara de verdade a cada 15
# min é um serviço externo de cron gratuito (cron-job.org) chamando
# POST /api/cron-trigger?job=b3_trades (ver app/app.py) -- o `schedule:`
# abaixo é só um FALLBACK de 1x/hora nas horas de pregão, caso o cron
# externo tenha uma falha.
# CADÊNCIA REAL: 30 MINUTOS, não 15 (mudado em 20/08/2026).
#
# Igual à varredura de notícias, quem dispara de verdade é o cron externo
# (cron-job.org, `?job=b3_trades`) -- MUDE LÁ TAMBÉM, senão continua de 15
# em 15 min. O `schedule:` abaixo permanece como fallback horário.
#
# Motivo: Disk IO do Supabase em 100%. Este job é caro por natureza -- a B3
# devolve o DIA INTEIRO a cada consulta (~17 mil negócios no fim do
# pregão), então cada execução relê tudo para descobrir o que é novo.
# Metade das execuções, metade dessa releitura.
#
# Perda: um negócio pode demorar até 30 min para aparecer na aba Balcão B3,
# em vez de 15. A seção "ao vivo" continua sendo a mais fresca que existe;
# a própria B3 só republica o arquivo de 15 em 15 minutos.
on:
  schedule:
    - cron: "0 12-21 * * 1-5"  # 12h-21h UTC = 9h-18h BRT, seg-sex (fallback horário)
  # `start`/`end` opcionais -- vazio (uso normal, disparado pelo relay a
  # cada 15 min) = só hoje. Preenchidos = backfill pontual manual (Allan
  # via Actions -> "Run workflow", pedido dele 24/07/2026: catch-up dos
  # últimos 5 dias na primeira subida do módulo pro Supabase).
  workflow_dispatch:
    inputs:
      start:
        description: "Data inicial (AAAA-MM-DD) -- deixe em branco pro uso normal (só hoje)"
        required: false
        default: ""
      end:
        description: "Data final (AAAA-MM-DD) -- deixe em branco (usa a mesma que start, ou hoje)"
        required: false
        default: ""

concurrency:
  group: b3_trades
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # FAULTHANDLER (08/09/2026). Duas execuções morreram com
    # `Segmentation fault (core dumped)` -- exit 139, o processo abatido
    # pelo sistema, sem exceção e sem traceback: a varredura de notícias e
    # o catch-up do negócio a negócio da B3. Sem stack não há diagnóstico,
    # só palpite.
    #
    # Esta variável liga o `faulthandler` da biblioteca padrão do Python:
    # ao receber SIGSEGV, ele imprime a pilha de chamadas (inclusive a
    # linha de código C que estourou) antes de morrer. Custo zero em
    # execução normal.
    env:
      PYTHONFAULTHANDLER: "1"
    # 25 min, não 10 (08/09/2026). O uso do dia a dia é UM pregão e leva
    # cerca de um minuto -- este teto é para o backfill manual, que agora
    # roda dia a dia (ver scripts/fetch_b3_trades.py) e portanto soma o
    # tempo de todos os dias do intervalo. O catch-up de 03/09 a 08/09
    # gastou 8m30s só na captura das 84 páginas, com o teto de 10 min em
    # cima -- margem nenhuma.
    #
    # Prender o job por mais tempo não atropela o dia a dia: o
    # `concurrency` acima põe a próxima execução na fila em vez de rodar
    # em cima desta.
    timeout-minutes: 25
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Capturar negócio a negócio
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # NOVO (27/07/2026): calcular spread (bps) de cada negócio IPCA+
          # Incentivadas precisa da taxa de NTN-B do dia (mesma API da
          # Anbima usada em spreads_daily.yml) -- ver
          # app/spreads/b3_trades.py::compute_trade_spreads.
          ANBIMA_CLIENT_ID: ${{ secrets.ANBIMA_CLIENT_ID }}
          ANBIMA_CLIENT_SECRET: ${{ secrets.ANBIMA_CLIENT_SECRET }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.start }}" ]; then ARGS="$ARGS --start ${{ github.event.inputs.start }}"; fi
          if [ -n "${{ github.event.inputs.end }}" ]; then ARGS="$ARGS --end ${{ github.event.inputs.end }}"; fi
          python -m scripts.fetch_b3_trades $ARGS
