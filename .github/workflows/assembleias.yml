name: Agentes fiduciários (3x ao dia)

# Roda scripts/rodada_assembleias.py: Vórtx, Oliveira Trust e Pentágono
# (config.FONTES_LENTAS), que saíram da varredura de 15 em 15 min em
# 11/09/2026 por levarem dezenas de minutos. O script nasceu naquele dia,
# mas o workflow que deveria chamá-lo nunca foi criado -- de 11/09 a
# 29/10/2026 nenhuma assembleia foi coletada na nuvem. 20h17 BRT.
on:
  # 3x ao dia (03/11/2026, pedido do Allan): 08h47, 13h47 e 19h47 BRT
  # (UTC-3). Minuto "quebrado" porque o GitHub atrasa mais o minuto 0.
  schedule:
    - cron: "47 11 * * *"
    - cron: "47 16 * * *"
    - cron: "47 22 * * *"
  workflow_dispatch:
    inputs:
      refazer_desde:
        description: "Apaga e regrava os documentos encontrados desde esta data (AAAA-MM-DD). Vazio = não apaga."
        required: false
        default: ""

concurrency:
  group: assembleias
  cancel-in-progress: false

jobs:
  assembleias:
    runs-on: ubuntu-latest
    env:
      PYTHONFAULTHANDLER: "1"
      PSYCOPG_IMPL: python
      # Teto por fonte. Por API a Vórtx leva ~9 min (03/11/2026).
      SCRAPE_TIMEOUT_FONTE: "900"
    timeout-minutes: 30
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip uninstall -y psycopg-binary || true
          python -c "import psycopg" \
            || (sudo apt-get update -qq && sudo apt-get install -y -qq libpq5)

      # Tira os documentos da Vórtx gravados com link que vence (até
      # 04/11/2026). Sem nada a apagar, não faz nada.
      - name: Limpar links antigos da Vortx
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${{ github.event.inputs.refazer_desde }}" ]; then
            python -m scripts.limpar_links_vortx --refazer-desde "${{ github.event.inputs.refazer_desde }}"
          else
            python -m scripts.limpar_links_vortx
          fi

      - name: Rodar as fontes de agente fiduciario
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.rodada_assembleias
