name: Varredura de noticias

# Roda scripts/run_once.py, que faz UMA varredura completa (todas as fontes
# habilitadas) e grava direto no banco do Supabase -- ver CLAUDE.md, secao
# "Roteiro de migracao para a nuvem". `workflow_dispatch` existe pra: (1) o
# botao "Forcar atualizacao" do site poder acionar uma rodada sob demanda,
# e (2) o endpoint /api/cron-trigger (chamado por um cron externo gratuito,
# cron-job.org) acionar a cada 5 min DE VERDADE -- o `schedule:` abaixo e'
# so' um FALLBACK de 1x/hora, porque o schedule nativo do GitHub Actions
# nao e' pontual (o proprio GitHub nao garante horario, atrasa bastante em
# horario de pico -- documentado, nao e' bug daqui). 17/07/2026.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

# CADÊNCIA REAL: 15 MINUTOS, não 5 (mudado em 20/08/2026).
#
# Quem dispara de verdade é o cron externo (cron-job.org) chamando
# /api/cron-trigger -- o `schedule:` acima é só o fallback horário. Então
# MUDAR AQUI NÃO BASTA: o intervalo tem que ser alterado no cron-job.org
# também, senão continua disparando de 5 em 5 min.
#
# Motivo: 5 min = 288 execuções/dia, cada uma abrindo conexão e escrevendo
# no Supabase. Em 25/08/2026 o Disk IO do projeto estava cravado em 100%
# (com CPU em 18% e o banco ocupando só 176 MB -- saturação de operações,
# não de espaço), e o site passou a devolver 504 e falha de autenticação
# na conexão. 15 min corta dois terços dessa carga.
#
# Para monitoramento de notícias de crédito, a diferença entre saber de um
# fato relevante em 5 ou em 15 minutos não muda decisão nenhuma.

# Se uma rodada ainda estiver rodando quando a proxima do cron disparar
# (Playwright pode demorar), a nova espera na fila em vez de rodar em cima
# da anterior -- evita duas varreduras escrevendo no banco ao mesmo tempo.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # FAULTHANDLER (08/09/2026). Duas execuções morreram com
    # `Segmentation fault (core dumped)` -- exit 139, o processo abatido
    # pelo sistema, sem exceção e sem traceback: a varredura de notícias e
    # o catch-up do negócio a negócio da B3. Sem stack não há diagnóstico,
    # só palpite.
    #
    # Esta variável liga o `faulthandler` da biblioteca padrão do Python:
    # ao receber SIGSEGV, ele imprime a pilha de chamadas (inclusive a
    # linha de código C que estourou) antes de morrer. Custo zero em
    # execução normal.
    env:
      PYTHONFAULTHANDLER: "1"
      # Implementacao do psycopg: `python` usa a libpq do sistema em vez do
      # wheel binario -- ver o passo "Instalar dependencias". Explicito de
      # proposito: se um dia a libpq sumir do runner, o job falha na hora,
      # com mensagem clara, em vez de voltar em silencio pro binario que
      # causava o segfault.
      PSYCOPG_IMPL: python
    # 20 min, nao 10 (08/09/2026). O passo agora tenta ate 3 vezes (ver o
    # comentario no passo "Rodar a varredura"), entao o teto tem que caber
    # mais de uma tentativa. Com o N+1 corrigido uma varredura leva ~1 min;
    # a folga e para o caso ruim, nao para o normal.
    timeout-minutes: 20
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        # SEM O WHEEL BINARIO DO PSYCOPG (08/09/2026).
        #
        # CAUSA RAIZ, achada com o faulthandler ligado neste mesmo dia. O
        # processo morria com `Segmentation fault` (exit 139) e a pilha
        # apontou para dentro do psycopg_binary, executando `SELECT
        # version()` -- a consulta que o SQLAlchemy faz UMA vez, ao abrir a
        # primeira conexao. Ou seja: nao era volume de dado, nao era o
        # INSERT, nao era o Playwright. Era a conexao em si.
        #
        # `psycopg[binary]` traz a propria libpq E o proprio OpenSSL dentro
        # do wheel. No mesmo processo ja existe outro OpenSSL, o do Python
        # (usado por requests/urllib3 e, na varredura, pelo curl_cffi). Dois
        # OpenSSL carregados juntos e uma fonte classica de segfault durante
        # o handshake TLS -- e a conexao com o Supabase e TLS.
        #
        # Tirando o wheel binario, o psycopg passa a usar a libpq do sistema
        # (que o runner ja tem) e o OpenSSL do sistema. Um so, sem conflito.
        #
        # requirements.txt continua pedindo `psycopg[binary]` de proposito:
        # no Windows do Allan nao ha libpq do sistema, e la o wheel binario e
        # a unica opcao que funciona. A troca vale so aqui, no runner Linux.
        run: |
          pip install -r requirements.txt
          pip uninstall -y psycopg-binary || true
          python -c "import psycopg" \
            || (sudo apt-get update -qq && sudo apt-get install -y -qq libpq5)
          python -c "import psycopg; print('psycopg impl:', psycopg.pq.__impl__, '| libpq', psycopg.pq.version())"

      - name: Instalar navegadores do Playwright
        run: |
          python -m playwright install --with-deps chromium
          # Chrome "de verdade" (usado pelo coletor da S&P pra reduzir
          # deteccao de robo, com fallback automatico pro Chromium se
          # isso falhar aqui -- nao trava o job) -- ver app/sources/spglobal.py
          python -m playwright install --with-deps chrome || true

      - name: Rodar a varredura
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # ATE 3 TENTATIVAS (08/09/2026). Um `Segmentation fault` mata o
        # processo inteiro -- nao existe `except` que pegue isso, entao a
        # unica defesa e tentar de novo por fora. A troca do psycopg no
        # passo de instalacao ataca a causa; isto aqui e a rede de seguranca
        # para qualquer queda abrupta que sobre (inclusive uma conexao que o
        # pooler da Supabase derruba no meio).
        #
        # Repetir e barato porque a gravacao ja e idempotente: o dedupe e
        # por `trade_code` e o commit e por lote, entao a tentativa seguinte
        # so grava o que faltou, em vez de refazer tudo.
        run: |
          for tentativa in 1 2 3; do
            if python -m scripts.run_once; then
              exit 0
            fi
            echo "::warning::varredura: tentativa $tentativa caiu -- repetindo em 20s"
            sleep 20
          done
          echo "::error::varredura falhou nas 3 tentativas"
          exit 1
