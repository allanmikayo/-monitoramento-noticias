name: Calendário de resultados -- ITR/DFP da CVM (diário)

# Datas de entrega de ITR/DFP (Dados Abertos da CVM) para o calendário de
# resultados da página inicial -- scripts/coletar_resultados_cvm.py e
# app/calendario.py. A CVM atualiza os arquivos uma vez por semana; rodar
# todo dia pega a atualização no primeiro dia em que ela sai. O "divulgou
# hoje" vem do coletor do RAD (scrape.yml), não daqui.
# 07h20 BRT = 10h20 UTC, de segunda a sábado (depois do ofertas_cvm).
on:
  schedule:
    - cron: "20 10 * * 1-6"
  workflow_dispatch:

concurrency:
  group: resultados_cvm
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # FAULTHANDLER (08/09/2026). Duas execuções morreram com
    # `Segmentation fault (core dumped)` -- exit 139, o processo abatido
    # pelo sistema, sem exceção e sem traceback: a varredura de notícias e
    # o catch-up do negócio a negócio da B3. Sem stack não há diagnóstico,
    # só palpite.
    #
    # Esta variável liga o `faulthandler` da biblioteca padrão do Python:
    # ao receber SIGSEGV, ele imprime a pilha de chamadas (inclusive a
    # linha de código C que estourou) antes de morrer. Custo zero em
    # execução normal.
    env:
      PYTHONFAULTHANDLER: "1"
      # Implementacao do psycopg: `python` usa a libpq do sistema em vez do
      # wheel binario -- ver o passo "Instalar dependencias". Explicito de
      # proposito: se um dia a libpq sumir do runner, o job falha na hora,
      # com mensagem clara, em vez de voltar em silencio pro binario que
      # causava o segfault.
      PSYCOPG_IMPL: python
    timeout-minutes: 25
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        # SEM O WHEEL BINARIO DO PSYCOPG (08/09/2026).
        #
        # CAUSA RAIZ, achada com o faulthandler ligado neste mesmo dia. O
        # processo morria com `Segmentation fault` (exit 139) e a pilha
        # apontou para dentro do psycopg_binary, executando `SELECT
        # version()` -- a consulta que o SQLAlchemy faz UMA vez, ao abrir a
        # primeira conexao. Ou seja: nao era volume de dado, nao era o
        # INSERT, nao era o Playwright. Era a conexao em si.
        #
        # `psycopg[binary]` traz a propria libpq E o proprio OpenSSL dentro
        # do wheel. No mesmo processo ja existe outro OpenSSL, o do Python
        # (usado por requests/urllib3 e, na varredura, pelo curl_cffi). Dois
        # OpenSSL carregados juntos e uma fonte classica de segfault durante
        # o handshake TLS -- e a conexao com o Supabase e TLS.
        #
        # Tirando o wheel binario, o psycopg passa a usar a libpq do sistema
        # (que o runner ja tem) e o OpenSSL do sistema. Um so, sem conflito.
        #
        # requirements.txt continua pedindo `psycopg[binary]` de proposito:
        # no Windows do Allan nao ha libpq do sistema, e la o wheel binario e
        # a unica opcao que funciona. A troca vale so aqui, no runner Linux.
        run: |
          pip install -r requirements.txt
          pip uninstall -y psycopg-binary || true
          python -c "import psycopg" \
            || (sudo apt-get update -qq && sudo apt-get install -y -qq libpq5)
          python -c "import psycopg; print('psycopg impl:', psycopg.pq.__impl__, '| libpq', psycopg.pq.version())"

      - name: Coletar datas de ITR/DFP da CVM
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.coletar_resultados_cvm
