name: Securitizados CRI/CRA (diário)

# Roda scripts/fetch_securitizados.py contra a API oficial da Anbima
# (/feed/precos-indices/v1/cri-cra/mercado-secundario). Fase 2 do Hub
# Credit Research (04/08/2026) -- alimenta a aba Securitizados, que até
# então não tinha fonte no banco.
#
# HORÁRIO: 21h30 BRT = 00h30 UTC. Trinta minutos DEPOIS do job de
# debêntures (spreads_daily.yml, 00h UTC) de propósito -- não é
# preferência, é dependência:
#
#   Papel CRI/CRA em IPCA+ precisa da taxa da NTN-B de referência pra ter
#   spread, e essa curva já é buscada e cacheada pelo job de debêntures
#   (tabela `ntnb_referencia`). Rodando depois, este job LÊ o cache em vez
#   de bater na Anbima de novo pelo mesmo dado. Se por algum motivo o de
#   debêntures falhar ou atrasar, este busca a curva ao vivo (ver
#   scripts/fetch_securitizados.py::_curva_ntnb) -- degrada, não quebra.
#
# A Anbima divulga a partir das 20h de Brasília, então 21h30 dá folga.
# Brasil não tem horário de verão desde 2019 (fuso fixo -3), o cron não
# precisa de ajuste sazonal.
on:
  # AGENDAMENTO RESTAURADO em 20/08/2026 -- ver a nota equivalente em
  # spreads_daily.yml. Cada peça volta a ter seu próprio workflow.
  #
  # A dependência da curva de NTN-B (descrita acima) continua sendo
  # resolvida pelos 30 minutos de folga em relação ao job de debêntures.
  # Não é garantia, é folga -- mas o script DEGRADA em vez de quebrar:
  # sem o cache, `fetch_securitizados._curva_ntnb` busca ao vivo na Anbima.
  # O custo de errar aqui é uma requisição a mais, não um dia perdido.
  schedule:
    - cron: "30 0 * * *"
  # Vazio (uso normal) = só hoje. Preenchidos = backfill manual pelo
  # Allan em Actions -> "Run workflow".
  workflow_dispatch:
    inputs:
      start:
        description: "Data inicial (AAAA-MM-DD) -- em branco = hoje"
        required: false
        default: ""
      end:
        description: "Data final (AAAA-MM-DD) -- em branco = igual a start"
        required: false
        default: ""

# Backfill longo disparado à mão não pode rodar em cima do job diário --
# os dois escrevem nas mesmas tabelas.
concurrency:
  group: securitizados
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # FAULTHANDLER (08/09/2026). Duas execuções morreram com
    # `Segmentation fault (core dumped)` -- exit 139, o processo abatido
    # pelo sistema, sem exceção e sem traceback: a varredura de notícias e
    # o catch-up do negócio a negócio da B3. Sem stack não há diagnóstico,
    # só palpite.
    #
    # Esta variável liga o `faulthandler` da biblioteca padrão do Python:
    # ao receber SIGSEGV, ele imprime a pilha de chamadas (inclusive a
    # linha de código C que estourou) antes de morrer. Custo zero em
    # execução normal.
    env:
      PYTHONFAULTHANDLER: "1"
      # Implementacao do psycopg: `python` usa a libpq do sistema em vez do
      # wheel binario -- ver o passo "Instalar dependencias". Explicito de
      # proposito: se um dia a libpq sumir do runner, o job falha na hora,
      # com mensagem clara, em vez de voltar em silencio pro binario que
      # causava o segfault.
      PSYCOPG_IMPL: python
    timeout-minutes: 15
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        # SEM O WHEEL BINARIO DO PSYCOPG (08/09/2026).
        #
        # CAUSA RAIZ, achada com o faulthandler ligado neste mesmo dia. O
        # processo morria com `Segmentation fault` (exit 139) e a pilha
        # apontou para dentro do psycopg_binary, executando `SELECT
        # version()` -- a consulta que o SQLAlchemy faz UMA vez, ao abrir a
        # primeira conexao. Ou seja: nao era volume de dado, nao era o
        # INSERT, nao era o Playwright. Era a conexao em si.
        #
        # `psycopg[binary]` traz a propria libpq E o proprio OpenSSL dentro
        # do wheel. No mesmo processo ja existe outro OpenSSL, o do Python
        # (usado por requests/urllib3 e, na varredura, pelo curl_cffi). Dois
        # OpenSSL carregados juntos e uma fonte classica de segfault durante
        # o handshake TLS -- e a conexao com o Supabase e TLS.
        #
        # Tirando o wheel binario, o psycopg passa a usar a libpq do sistema
        # (que o runner ja tem) e o OpenSSL do sistema. Um so, sem conflito.
        #
        # requirements.txt continua pedindo `psycopg[binary]` de proposito:
        # no Windows do Allan nao ha libpq do sistema, e la o wheel binario e
        # a unica opcao que funciona. A troca vale so aqui, no runner Linux.
        run: |
          pip install -r requirements.txt
          pip uninstall -y psycopg-binary || true
          python -c "import psycopg" \
            || (sudo apt-get update -qq && sudo apt-get install -y -qq libpq5)
          python -c "import psycopg; print('psycopg impl:', psycopg.pq.__impl__, '| libpq', psycopg.pq.version())"

      - name: Capturar CRI/CRA
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANBIMA_CLIENT_ID: ${{ secrets.ANBIMA_CLIENT_ID }}
          ANBIMA_CLIENT_SECRET: ${{ secrets.ANBIMA_CLIENT_SECRET }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.start }}" ]; then ARGS="$ARGS --start ${{ github.event.inputs.start }}"; fi
          if [ -n "${{ github.event.inputs.end }}" ]; then ARGS="$ARGS --end ${{ github.event.inputs.end }}"; fi
          python -m scripts.fetch_securitizados $ARGS
